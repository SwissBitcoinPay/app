<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <!--
      The web app's Content-Security-Policy: no script but the app's own files and the relay
      frame's, by its hash (src/lib/nostr/relay-frame-script.ts), no eval but WebAssembly's (the
      Breez SDK, the scan's ZXing). First in the head: a policy only covers what follows it. EAS
      Hosting sends no header for a single-page app, hence a meta, which cannot carry
      frame-ancestors (src/lib/frame-guard.web.ts). Each value and why:
      src/__tests__/web-csp.test.ts.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-99P8kKSWhOR/u+TJm2j3kw4E7EYEfL3Lu62bMtlkgew='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self' https: wss: http: ws:; frame-src https://btcmap.org; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!--
      The web app installable: its manifest, the
      variant's icon and its tab icon, written at export time from the app config
      (scripts/web-manifest.js). No service worker, on purpose (web-manifest.test.ts).
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/favicon.ico" />
    <!--
      The browser's bars (an installed app's title bar, Android's status bar, Safari's tab bar) in
      the app's canvas of the device's theme, until the app's code names this device's "Theme"
      (surroundings.web.ts). Colours of src/theme/tokens.ts (background.app).
    -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FAF6EE" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B1A33" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <!--
      Expo's own template (@expo/cli, static/template/index.html), plus the page's first paint in
      the app's canvas of the device's theme ("Automatic", the default: src/features/appearance/),
      before the app's code takes over with this device's "Theme" (surroundings.web.ts): no white
      flash under a dark app. Colours of src/theme/tokens.ts (background.app).
    -->
    <style id="theme-canvas">
      html,
      body {
        background-color: #faf6ee;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background-color: #0b1a33;
          color-scheme: dark;
        }
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
