[build]
  ignore = "[ \"$BRANCH\" = \"translations\" ] || [[ $(git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF .env) && ( $(! git describe --exact-match --tags HEAD) || $PULL_REQUEST == true ) ]]"
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none'"